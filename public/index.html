<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    三界じゃんけん
</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #38245e 0%,
            #171222 45%,
            #09070d 100%
        );

    color: white;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow-x: hidden;

    transition:
        background 0.6s ease,
        box-shadow 0.6s ease;
}


/* ========================================
   魅了背景
======================================== */

body.charmed {

    background:
        radial-gradient(
            circle at top,
            #8b2d70 0%,
            #401936 45%,
            #140914 100%
        );

    box-shadow:
        inset 0 0 100px
        rgba(255, 80, 180, 0.25);
}


.container {

    width: min(1100px, 95%);

    text-align: center;

    position: relative;

    z-index: 2;
}


h1 {

    margin-bottom: 8px;

    font-size:
        clamp(30px, 6vw, 55px);

    letter-spacing: 0.08em;

    text-shadow:
        0 0 10px
        rgba(180, 120, 255, 0.7),

        0 0 30px
        rgba(120, 70, 255, 0.35);
}


h2 {

    margin-top: 10px;
}


.subtitle {

    opacity: 0.7;

    margin-bottom: 30px;
}


.screen {

    display: none;
}


.screen.active {

    display: block;
}


/* ========================================
   ボタン
======================================== */

button {

    border: none;

    border-radius: 14px;

    padding:
        14px 25px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    color: white;

    background:
        linear-gradient(
            135deg,
            #7d52c7,
            #523083
        );

    box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.35);

    transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease;
}


button:hover:not(:disabled) {

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 25px
        rgba(130, 80, 220, 0.5);
}


button:disabled {

    opacity: 0.35;

    cursor: not-allowed;
}


input {

    width:
        min(350px, 90%);

    padding:
        13px 15px;

    border:
        1px solid
        rgba(255, 255, 255, 0.2);

    border-radius: 10px;

    background:
        rgba(255, 255, 255, 0.08);

    color: white;

    font-size: 16px;

    outline: none;
}


input:focus {

    border-color:
        #b98cff;
}


.menu-buttons {

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;
}


.form-area {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 14px;
}


.error {

    color: #ff8a9e;

    min-height: 24px;
}


.room-info {

    margin:
        18px auto;

    padding: 15px;

    max-width: 550px;

    border-radius: 14px;

    background:
        rgba(255, 255, 255, 0.07);
}


.room-code {

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 0.15em;

    color: #d7b8ff;
}


.share-url {

    margin-top: 10px;

    word-break: break-all;

    opacity: 0.75;

    font-size: 14px;
}


/* ========================================
   ステータス
======================================== */

#status {

    margin:
        10px 0 20px;

    min-height: 30px;

    font-size: 20px;

    font-weight: bold;
}


/* ========================================
   カード
======================================== */

.choices {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: 25px;

    flex-wrap: wrap;

    margin-top: 20px;
}


.choice {

    width: 230px;

    padding:
        18px 14px;

    border-radius: 22px;

    background:
        rgba(255, 255, 255, 0.07);

    border:
        1px solid
        rgba(255, 255, 255, 0.12);

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        opacity 0.25s ease,
        box-shadow 0.25s ease;
}


.choice:hover:not(.disabled) {

    transform:
        translateY(-6px)
        scale(1.03);

    background:
        rgba(255, 255, 255, 0.12);

    box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.35);
}


.choice.disabled {

    opacity: 0.3;

    cursor: not-allowed;

    filter:
        grayscale(0.8);
}


.choice.charm-locked {

    opacity: 0.18;

    filter:
        grayscale(1)
        brightness(0.6);
}


/* ========================================
   ふわふわ
======================================== */

@keyframes fluffySway {

    0%,
    100% {

        transform:
            translateX(-5px)
            rotate(-1.5deg);
    }

    50% {

        transform:
            translateX(5px)
            rotate(1.5deg);
    }
}


.choice img {

    width: 100%;

    height: 230px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0, 0, 0, 0.45)
        );

    animation:
        fluffySway
        2s
        ease-in-out
        infinite;

    transform-origin:
        center bottom;
}


.choice:nth-child(2) img {

    animation-delay:
        -0.65s;
}


.choice:nth-child(3) img {

    animation-delay:
        -1.3s;
}


.choice-name {

    margin-top: 8px;

    font-size: 24px;

    font-weight: bold;
}


.choice-hand {

    margin-top: 4px;

    opacity: 0.65;

    font-size: 14px;
}


/* ========================================
   ホストパネル
======================================== */

#hostPanel {

    display: none;

    margin:
        25px auto 0;

    padding: 18px;

    max-width: 760px;

    border-radius: 18px;

    background:
        rgba(255, 255, 255, 0.07);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);
}


#guestChoiceText {

    font-size: 20px;

    font-weight: bold;

    color: #e1c9ff;
}


#charmButton {

    margin-top: 15px;

    background:
        linear-gradient(
            135deg,
            #ff4fa7,
            #a82979
        );

    box-shadow:
        0 5px 20px
        rgba(255, 70, 170, 0.35);
}


#charmInfo {

    margin-top: 10px;

    min-height: 22px;

    color: #ff9bd2;
}


/* ========================================
   ★ ゲスト画像変更パネル
======================================== */

.guest-image-control {

    margin-top: 22px;

    padding-top: 18px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.12);
}


.guest-image-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 12px;

    color: #d8c2ff;
}


.image-change-buttons {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;
}


.image-change-button {

    padding:
        10px 14px;

    font-size: 14px;

    background:
        linear-gradient(
            135deg,
            #4d416d,
            #33294c
        );
}


.image-change-button.active-b {

    background:
        linear-gradient(
            135deg,
            #bc55df,
            #7135a3
        );

    box-shadow:
        0 0 18px
        rgba(192, 90, 255, 0.4);
}


#guestImageInfo {

    margin-top: 12px;

    min-height: 20px;

    font-size: 14px;

    opacity: 0.8;
}


/* ========================================
   魅了
======================================== */

#charmFlash {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    pointer-events: none;

    opacity: 0;

    z-index: 999;

    font-size:
        clamp(
            50px,
            12vw,
            130px
        );

    text-shadow:
        0 0 20px #ff65bd,
        0 0 60px #ff218f;
}


#charmFlash.show {

    animation:
        charmFlashAnimation
        1.4s
        ease
        forwards;
}


@keyframes charmFlashAnimation {

    0% {

        opacity: 0;

        transform:
            scale(0.3);
    }

    30% {

        opacity: 1;

        transform:
            scale(1.25);
    }

    65% {

        opacity: 1;

        transform:
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            scale(1.5);
    }
}


.charm-heart {

    position: fixed;

    pointer-events: none;

    z-index: 998;

    user-select: none;

    animation:
        heartFly
        2.2s
        ease-out
        forwards;
}


@keyframes heartFly {

    0% {

        opacity: 0;

        transform:
            translateY(30px)
            scale(0.4)
            rotate(0deg);
    }

    20% {

        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-180px)
            scale(1.4)
            rotate(20deg);
    }
}


/* ========================================
   VS
======================================== */

#battleOverlay {

    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    background:
        rgba(5, 3, 10, 0.94);

    z-index: 500;
}


#battleOverlay.show {

    display: flex;
}


#countdown {

    font-size:
        clamp(
            80px,
            20vw,
            180px
        );

    font-weight: bold;

    text-shadow:
        0 0 30px
        rgba(180, 120, 255, 0.8);
}


#battleArea {

    display: none;

    width:
        min(1000px, 95%);

    justify-content: center;

    align-items: center;

    gap: 30px;
}


.fighter {

    flex: 1;

    text-align: center;
}


.fighter img {

    width:
        min(330px, 35vw);

    height:
        min(400px, 45vh);

    object-fit: contain;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0, 0, 0, 0.6)
        );

    animation:
        fluffySway
        1.8s
        ease-in-out
        infinite;

    transform-origin:
        center bottom;
}


.fighter:last-child img {

    animation-delay:
        -0.9s;
}


.vs-text {

    font-size:
        clamp(
            45px,
            9vw,
            90px
        );

    font-weight: bold;

    color: #d4b0ff;

    text-shadow:
        0 0 20px
        #7c3cff;
}


#battleResult {

    display: none;

    margin-top: 25px;

    font-size:
        clamp(
            50px,
            12vw,
            110px
        );

    font-weight: 900;

    letter-spacing: 0.08em;

    text-shadow:
        0 0 30px
        currentColor;
}


#rematchArea {

    display: none;

    margin-top: 20px;
}


#rematchStatus {

    margin-top: 12px;

    opacity: 0.75;
}


/* ========================================
   スマホ
======================================== */

@media (max-width: 700px) {

    .choice {

        width: 29%;

        min-width: 100px;

        padding:
            10px 6px;
    }


    .choice img {

        height: 150px;
    }


    .choices {

        gap: 8px;
    }


    .choice-name {

        font-size: 18px;
    }


    #battleArea {

        gap: 10px;
    }


    .fighter img {

        width: 34vw;

        height: 250px;
    }


    .image-change-buttons {

        flex-direction: column;
    }
}

</style>

</head>


<body>


<div id="charmFlash">

    💗 魅了 💗

</div>


<div class="container">


<h1>
    三界じゃんけん
</h1>


<div class="subtitle">

    魔族・人間・天使

</div>


<!-- =====================================
     メニュー
===================================== -->

<section
    id="menuScreen"
    class="screen active"
>

    <h2>
        遊び方を選択
    </h2>

    <div class="menu-buttons">

        <button id="showCreateButton">
            部屋を作る
        </button>

        <button id="showJoinButton">
            部屋に参加
        </button>

    </div>

</section>


<!-- =====================================
     部屋作成
===================================== -->

<section
    id="createScreen"
    class="screen"
>

    <h2>
        部屋を作る
    </h2>

    <div class="form-area">

        <input
            id="hostPassword"
            type="password"
            placeholder="ホスト用パスワード"
        >

        <button id="createRoomButton">
            作成
        </button>

        <div
            id="createError"
            class="error"
        ></div>

        <button id="backFromCreate">
            戻る
        </button>

    </div>

</section>


<!-- =====================================
     部屋参加
===================================== -->

<section
    id="joinScreen"
    class="screen"
>

    <h2>
        部屋に参加
    </h2>

    <div class="form-area">

        <input
            id="roomIdInput"
            type="text"
            placeholder="部屋コード"
            maxlength="6"
        >

        <button id="joinRoomButton">
            参加
        </button>

        <div
            id="joinError"
            class="error"
        ></div>

        <button id="backFromJoin">
            戻る
        </button>

    </div>

</section>


<!-- =====================================
     ゲーム
===================================== -->

<section
    id="gameScreen"
    class="screen"
>

    <div class="room-info">

        部屋コード

        <div
            id="roomCode"
            class="room-code"
        ></div>

        <div
            id="shareUrl"
            class="share-url"
        ></div>

    </div>


    <div id="status">

        接続待ち...

    </div>


    <!-- =================================
         ホスト専用
    ================================== -->

    <div id="hostPanel">


        <div>
            相手の選択
        </div>


        <div id="guestChoiceText">

            まだ選んでいません

        </div>


        <button id="charmButton">

            💗 魅了する

        </button>


        <div id="charmInfo"></div>


        <!-- ★ ゲスト画像変更 -->

        <div class="guest-image-control">


            <div class="guest-image-title">

                ゲスト側のカード画像変更

            </div>


            <div class="image-change-buttons">


                <button
                    class="image-change-button"
                    data-image-choice="demon"
                >

                    😈 魔族：A

                </button>


                <button
                    class="image-change-button"
                    data-image-choice="human"
                >

                    👤 人間：A

                </button>


                <button
                    class="image-change-button"
                    data-image-choice="angel"
                >

                    👼 天使：A

                </button>


            </div>


            <div id="guestImageInfo">

                ボタンを押すとゲスト側だけ A ⇄ B が切り替わります

            </div>


        </div>


    </div>


    <!-- =================================
         カード
    ================================== -->

    <div class="choices">


        <!-- 魔族 -->

        <div
            class="choice"
            data-choice="demon"
        >

            <img
                id="demonImage"
                src="/images/demon.png"
                alt="魔族"
            >

            <div class="choice-name">
                魔族
            </div>

            <div class="choice-hand">
                グー
            </div>

        </div>


        <!-- 人間 -->

        <div
            class="choice"
            data-choice="human"
        >

            <img
                id="humanImage"
                src="/images/human.png"
                alt="人間"
            >

            <div class="choice-name">
                人間
            </div>

            <div class="choice-hand">
                チョキ
            </div>

        </div>


        <!-- 天使 -->

        <div
            class="choice"
            data-choice="angel"
        >

            <img
                id="angelImage"
                src="/images/angel.png"
                alt="天使"
            >

            <div class="choice-name">
                天使
            </div>

            <div class="choice-hand">
                パー
            </div>

        </div>


    </div>


</section>


</div>


<!-- =====================================
     VS
===================================== -->

<div id="battleOverlay">


<div id="countdown">

    3

</div>


<div id="battleArea">


    <div class="fighter">

        <div>
            YOU
        </div>

        <img
            id="yourBattleImage"
            src=""
            alt=""
        >

    </div>


    <div class="vs-text">

        VS

    </div>


    <div class="fighter">

        <div>
            OPPONENT
        </div>

        <img
            id="opponentBattleImage"
            src=""
            alt=""
        >

    </div>


</div>


<div id="battleResult"></div>


<div id="rematchArea">

    <button id="rematchButton">

        もう一度

    </button>

    <div id="rematchStatus"></div>

</div>


</div>


<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();


/* ========================================
   DOM
======================================== */

const screens =
    document.querySelectorAll(
        ".screen"
    );


const menuScreen =
    document.getElementById(
        "menuScreen"
    );


const createScreen =
    document.getElementById(
        "createScreen"
    );


const joinScreen =
    document.getElementById(
        "joinScreen"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const statusText =
    document.getElementById(
        "status"
    );


const roomCode =
    document.getElementById(
        "roomCode"
    );


const shareUrl =
    document.getElementById(
        "shareUrl"
    );


const createError =
    document.getElementById(
        "createError"
    );


const joinError =
    document.getElementById(
        "joinError"
    );


const hostPanel =
    document.getElementById(
        "hostPanel"
    );


const guestChoiceText =
    document.getElementById(
        "guestChoiceText"
    );


const charmButton =
    document.getElementById(
        "charmButton"
    );


const charmInfo =
    document.getElementById(
        "charmInfo"
    );


const guestImageInfo =
    document.getElementById(
        "guestImageInfo"
    );


const imageChangeButtons =
    document.querySelectorAll(
        ".image-change-button"
    );


const choices =
    document.querySelectorAll(
        ".choice"
    );


const demonImage =
    document.getElementById(
        "demonImage"
    );


const humanImage =
    document.getElementById(
        "humanImage"
    );


const angelImage =
    document.getElementById(
        "angelImage"
    );


const battleOverlay =
    document.getElementById(
        "battleOverlay"
    );


const countdown =
    document.getElementById(
        "countdown"
    );


const battleArea =
    document.getElementById(
        "battleArea"
    );


const battleResult =
    document.getElementById(
        "battleResult"
    );


const yourBattleImage =
    document.getElementById(
        "yourBattleImage"
    );


const opponentBattleImage =
    document.getElementById(
        "opponentBattleImage"
    );


const rematchArea =
    document.getElementById(
        "rematchArea"
    );


const rematchButton =
    document.getElementById(
        "rematchButton"
    );


const rematchStatus =
    document.getElementById(
        "rematchStatus"
    );


const charmFlash =
    document.getElementById(
        "charmFlash"
    );


/* ========================================
   状態
======================================== */

let myRole = null;

let currentRoomId = null;

let isCharmed = false;

let ambientHeartTimer = null;


/*
    false = A
    true  = B
*/

let guestImages = {

    demon: false,
    human: false,
    angel: false
};


/* ========================================
   画面切り替え
======================================== */

function showScreen(screen) {

    screens.forEach(s => {

        s.classList.remove(
            "active"
        );
    });

    screen.classList.add(
        "active"
    );
}


/* ========================================
   メニュー
======================================== */

document
    .getElementById(
        "showCreateButton"
    )
    .addEventListener(
        "click",
        () => {

            createError.textContent =
                "";

            showScreen(
                createScreen
            );
        }
    );


document
    .getElementById(
        "showJoinButton"
    )
    .addEventListener(
        "click",
        () => {

            joinError.textContent =
                "";

            showScreen(
                joinScreen
            );
        }
    );


document
    .getElementById(
        "backFromCreate"
    )
    .addEventListener(
        "click",
        () => {

            showScreen(
                menuScreen
            );
        }
    );


document
    .getElementById(
        "backFromJoin"
    )
    .addEventListener(
        "click",
        () => {

            showScreen(
                menuScreen
            );
        }
    );


/* ========================================
   部屋作成
======================================== */

document
    .getElementById(
        "createRoomButton"
    )
    .addEventListener(
        "click",
        () => {

            const password =
                document
                    .getElementById(
                        "hostPassword"
                    )
                    .value;

            createError.textContent =
                "";

            socket.emit(
                "createRoom",
                password
            );
        }
    );


/* ========================================
   部屋参加
======================================== */

document
    .getElementById(
        "joinRoomButton"
    )
    .addEventListener(
        "click",
        () => {

            const id =
                document
                    .getElementById(
                        "roomIdInput"
                    )
                    .value
                    .trim()
                    .toUpperCase();

            joinError.textContent =
                "";

            socket.emit(
                "joinRoom",
                id
            );
        }
    );


/* ========================================
   URLから部屋コード
======================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const roomFromUrl =
    urlParams.get(
        "room"
    );


if (roomFromUrl) {

    document
        .getElementById(
            "roomIdInput"
        )
        .value =
        roomFromUrl.toUpperCase();

    showScreen(
        joinScreen
    );
}


/* ========================================
   カード選択
======================================== */

choices.forEach(
    choice => {

        choice.addEventListener(
            "click",
            () => {

                if (
                    choice.classList
                        .contains(
                            "disabled"
                        )
                ) {
                    return;
                }

                const selected =
                    choice.dataset.choice;


                if (
                    myRole === "guest" &&
                    isCharmed &&
                    selected === "demon"
                ) {
                    return;
                }


                disableChoices();


                statusText.textContent =
                    "選択しました！";


                socket.emit(
                    "choose",
                    selected
                );
            }
        );
    }
);


/* ========================================
   カード無効化
======================================== */

function disableChoices() {

    choices.forEach(
        choice => {

            choice.classList.add(
                "disabled"
            );
        }
    );
}


/* ========================================
   カード有効化
======================================== */

function enableChoices() {

    choices.forEach(
        choice => {

            choice.classList.remove(
                "disabled",
                "charm-locked"
            );
        }
    );


    if (
        myRole === "guest" &&
        isCharmed
    ) {

        const demon =
            document.querySelector(
                '[data-choice="demon"]'
            );

        demon.classList.add(
            "disabled",
            "charm-locked"
        );
    }
}


/* ========================================
   ★ ゲスト画像取得
======================================== */

function getGuestNormalImage(
    choice
) {

    if (
        choice === "demon"
    ) {

        return guestImages.demon

            ? "/images/demon_b.png"

            : "/images/demon.png";
    }


    if (
        choice === "human"
    ) {

        return guestImages.human

            ? "/images/human_b.png"

            : "/images/human.png";
    }


    if (
        choice === "angel"
    ) {

        return guestImages.angel

            ? "/images/angel_b.png"

            : "/images/angel.png";
    }


    return "";
}


/* ========================================
   通常カード画像設定
======================================== */

function setNormalImages() {

    /*
        ホスト側は変更しない
    */

    if (
        myRole === "host"
    ) {

        demonImage.src =
            "/images/demon.png";

        humanImage.src =
            "/images/host_human.png";

        angelImage.src =
            "/images/angel.png";

        return;
    }


    /*
        ゲスト側だけA/B反映
    */

    demonImage.src =
        getGuestNormalImage(
            "demon"
        );

    humanImage.src =
        getGuestNormalImage(
            "human"
        );

    angelImage.src =
        getGuestNormalImage(
            "angel"
        );
}


/* ========================================
   魅了画像
======================================== */

function setCharmedImages() {

    if (
        myRole !== "guest"
    ) {
        return;
    }


    /*
        魔族はA/B画像のまま。
        ただし選択不可。

        人間・天使は
        魅了専用画像を優先。
    */

    demonImage.src =
        getGuestNormalImage(
            "demon"
        );


    humanImage.src =
        "/images/human_charmed.png";


    angelImage.src =
        "/images/angel_charmed.png";
}


/* ========================================
   ★ ホストの画像変更ボタン
======================================== */

imageChangeButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                if (
                    myRole !== "host"
                ) {
                    return;
                }

                const choice =
                    button.dataset
                        .imageChoice;


                socket.emit(
                    "toggleGuestImage",
                    choice
                );
            }
        );
    }
);


/* ========================================
   ★ 画像変更ボタン表示更新
======================================== */

function updateImageChangeButtons() {

    imageChangeButtons.forEach(
        button => {

            const choice =
                button.dataset
                    .imageChoice;


            const isB =
                guestImages[choice];


            let name = "";


            if (
                choice === "demon"
            ) {
                name = "😈 魔族";
            }


            if (
                choice === "human"
            ) {
                name = "👤 人間";
            }


            if (
                choice === "angel"
            ) {
                name = "👼 天使";
            }


            button.textContent =
                `${name}：${isB ? "B" : "A"}`;


            button.classList.toggle(
                "active-b",
                isB
            );
        }
    );
}


/* ========================================
   ★ サーバーから画像変更通知
======================================== */

socket.on(
    "guestImageChanged",
    data => {

        guestImages = {
            ...data.guestImages
        };


        updateImageChangeButtons();


        /*
            ゲスト画面だけ画像変更
        */

        if (
            myRole === "guest"
        ) {

            if (isCharmed) {

                setCharmedImages();

            } else {

                setNormalImages();
            }
        }


        /*
            ホストには変更結果を表示
        */

        if (
            myRole === "host"
        ) {

            const name =
                getChoiceName(
                    data.choice
                );


            guestImageInfo.textContent =
                `ゲストの${name}画像を ${data.isB ? "B" : "A"} に変更しました`;
        }
    }
);


/* ========================================
   VS画像
======================================== */

function getBattleImage(
    choice,
    role,
    charmed
) {


    /* ====================================
       ホスト
    ==================================== */

    if (
        role === "host"
    ) {

        if (
            choice === "demon"
        ) {

            return "/images/demon.png";
        }


        if (
            choice === "human"
        ) {

            return "/images/host_human.png";
        }


        if (
            choice === "angel"
        ) {

            return "/images/angel.png";
        }
    }


    /* ====================================
       ゲスト
    ==================================== */

    if (
        role === "guest"
    ) {


        /*
            魅了されたゲスト
        */

        if (charmed) {

            if (
                choice === "human"
            ) {

                return "/images/human_charmed.png";
            }


            if (
                choice === "angel"
            ) {

                return "/images/angel_charmed.png";
            }
        }


        /*
            通常ゲスト
        */

        return getGuestNormalImage(
            choice
        );
    }


    return "";
}


/* ========================================
   選択肢名
======================================== */

function getChoiceName(
    choice
) {

    if (
        choice === "demon"
    ) {
        return "魔族";
    }


    if (
        choice === "human"
    ) {
        return "人間";
    }


    if (
        choice === "angel"
    ) {
        return "天使";
    }


    return "";
}


/* ========================================
   勝敗
======================================== */

function getResult(
    you,
    opponent
) {

    if (
        you === opponent
    ) {

        return "DRAW";
    }


    if (

        (
            you === "demon" &&
            opponent === "human"
        )

        ||

        (
            you === "human" &&
            opponent === "angel"
        )

        ||

        (
            you === "angel" &&
            opponent === "demon"
        )

    ) {

        return "WIN";
    }


    return "LOSE";
}


/* ========================================
   魅了ボタン
======================================== */

charmButton.addEventListener(
    "click",
    () => {

        if (
            myRole !== "host"
        ) {
            return;
        }


        charmButton.disabled =
            true;


        charmInfo.textContent =
            "魅了を発動しています...";


        socket.emit(
            "useCharm"
        );
    }
);


/* ========================================
   ハート
======================================== */

function createHeart() {

    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "charm-heart";


    const hearts = [

        "💗",
        "💖",
        "💕",
        "💞",
        "💓"
    ];


    heart.textContent =
        hearts[
            Math.floor(
                Math.random() *
                hearts.length
            )
        ];


    heart.style.left =
        Math.random() *
        100 +
        "vw";


    heart.style.top =
        55 +
        Math.random() *
        40 +
        "vh";


    heart.style.fontSize =
        20 +
        Math.random() *
        45 +
        "px";


    heart.style.animationDuration =
        1.5 +
        Math.random() *
        1.5 +
        "s";


    document.body.appendChild(
        heart
    );


    setTimeout(
        () => {

            heart.remove();

        },
        3200
    );
}


/* ========================================
   魅了爆発
======================================== */

function playCharmExplosion() {

    charmFlash.classList.remove(
        "show"
    );


    void charmFlash.offsetWidth;


    charmFlash.classList.add(
        "show"
    );


    for (
        let i = 0;
        i < 55;
        i++
    ) {

        setTimeout(
            createHeart,
            i * 25
        );
    }
}


/* ========================================
   ホスト魅了演出
======================================== */

function playHostCharmEffect() {

    charmFlash.classList.remove(
        "show"
    );


    void charmFlash.offsetWidth;


    charmFlash.classList.add(
        "show"
    );


    for (
        let i = 0;
        i < 20;
        i++
    ) {

        setTimeout(
            createHeart,
            i * 35
        );
    }
}


/* ========================================
   常時ハート
======================================== */

function startAmbientHearts() {

    stopAmbientHearts();


    ambientHeartTimer =
        setInterval(
            () => {

                if (
                    isCharmed &&
                    myRole ===
                        "guest"
                ) {

                    createHeart();
                }

            },
            550
        );
}


function stopAmbientHearts() {

    if (
        ambientHeartTimer
    ) {

        clearInterval(
            ambientHeartTimer
        );


        ambientHeartTimer =
            null;
    }
}


/* ========================================
   魅了解除
======================================== */

function stopCharmMode() {

    isCharmed = false;


    document.body
        .classList
        .remove(
            "charmed"
        );


    stopAmbientHearts();


    setNormalImages();


    charmButton.disabled =
        false;


    charmButton.textContent =
        "💗 魅了する";


    charmInfo.textContent =
        "";
}


/* ========================================
   部屋作成成功
======================================== */

socket.on(
    "roomCreated",
    data => {

        myRole =
            "host";


        currentRoomId =
            data.roomId;


        if (
            data.guestImages
        ) {

            guestImages = {
                ...data.guestImages
            };
        }


        roomCode.textContent =
            currentRoomId;


        const url =
            `${window.location.origin}?room=${currentRoomId}`;


        shareUrl.textContent =
            url;


        hostPanel.style.display =
            "block";


        updateImageChangeButtons();


        setNormalImages();


        disableChoices();


        statusText.textContent =
            "ゲストの参加を待っています...";


        showScreen(
            gameScreen
        );
    }
);


/* ========================================
   部屋作成エラー
======================================== */

socket.on(
    "createRoomError",
    message => {

        createError.textContent =
            message;
    }
);


/* ========================================
   ゲスト参加成功
======================================== */

socket.on(
    "roomJoined",
    data => {

        myRole =
            "guest";


        currentRoomId =
            data.roomId;


        if (
            data.guestImages
        ) {

            guestImages = {
                ...data.guestImages
            };
        }


        roomCode.textContent =
            currentRoomId;


        shareUrl.textContent =
            "";


        hostPanel.style.display =
            "none";


        setNormalImages();


        statusText.textContent =
            "ゲーム開始を待っています...";


        showScreen(
            gameScreen
        );
    }
);


/* ========================================
   参加エラー
======================================== */

socket.on(
    "joinRoomError",
    message => {

        joinError.textContent =
            message;
    }
);


/* ========================================
   ゲスト参加
======================================== */

socket.on(
    "guestJoined",
    () => {

        statusText.textContent =
            "ゲストが参加しました！";
    }
);


/* ========================================
   ラウンド開始
======================================== */

socket.on(
    "roundStart",
    data => {

        if (
            data.guestImages
        ) {

            guestImages = {
                ...data.guestImages
            };
        }


        stopCharmMode();


        updateImageChangeButtons();


        battleOverlay
            .classList
            .remove(
                "show"
            );


        battleArea.style.display =
            "none";


        battleResult.style.display =
            "none";


        rematchArea.style.display =
            "none";


        countdown.style.display =
            "block";


        guestChoiceText.textContent =
            "まだ選んでいません";


        if (
            myRole === "guest"
        ) {

            statusText.textContent =
                "魔族・人間・天使から選んでください";


            enableChoices();

        } else {

            statusText.textContent =
                "ゲストが選択するまで待ってください";


            disableChoices();


            charmButton.disabled =
                false;


            charmButton.textContent =
                "💗 魅了する";
        }
    }
);


/* ========================================
   ゲスト選択
======================================== */

socket.on(
    "guestChoice",
    choice => {

        if (
            myRole !== "host"
        ) {
            return;
        }


        guestChoiceText.textContent =
            `${getChoiceName(choice)} を選択`;


        statusText.textContent =
            "相手の選択を確認しました。あなたの手を選んでください";


        charmButton.disabled =
            true;


        enableChoices();
    }
);


/* ========================================
   魅了
======================================== */

socket.on(
    "charmActivated",
    data => {

        if (
            myRole === "guest"
        ) {

            isCharmed =
                true;


            document.body
                .classList
                .add(
                    "charmed"
                );


            statusText.textContent =
                "💗 魅了された！ 人間か天使を選んでください 💗";


            setCharmedImages();


            enableChoices();


            playCharmExplosion();


            startAmbientHearts();
        }


        if (
            myRole === "host"
        ) {

            charmButton.disabled =
                true;


            charmButton.textContent =
                "💗 魅了発動済み";


            charmInfo.textContent =
                "相手を魅了しました！";


            playHostCharmEffect();
        }
    }
);


/* ========================================
   魅了エラー
======================================== */

socket.on(
    "charmError",
    message => {

        charmInfo.textContent =
            message;


        charmButton.disabled =
            false;
    }
);


/* ========================================
   選択拒否
======================================== */

socket.on(
    "choiceRejected",
    message => {

        statusText.textContent =
            message;


        if (
            myRole === "guest" &&
            isCharmed
        ) {

            enableChoices();
        }
    }
);


/* ========================================
   選択受付
======================================== */

socket.on(
    "choiceAccepted",
    data => {

        if (
            myRole === "guest"
        ) {

            statusText.textContent =
                "ホストの選択を待っています...";

        } else {

            statusText.textContent =
                "勝負！";
        }
    }
);


/* ========================================
   結果
======================================== */

socket.on(
    "result",
    data => {

        disableChoices();


        stopAmbientHearts();


        if (
            data.guestImages
        ) {

            guestImages = {
                ...data.guestImages
            };
        }


        const opponentRole =

            myRole === "host"

                ? "guest"

                : "host";


        yourBattleImage.src =
            getBattleImage(
                data.you,
                myRole,
                data.charmed
            );


        opponentBattleImage.src =
            getBattleImage(
                data.opponent,
                opponentRole,
                data.charmed
            );


        const result =
            getResult(
                data.you,
                data.opponent
            );


        showBattle(
            result
        );
    }
);


/* ========================================
   VS演出
======================================== */

function showBattle(
    result
) {

    battleOverlay
        .classList
        .add(
            "show"
        );


    countdown.style.display =
        "block";


    battleArea.style.display =
        "none";


    battleResult.style.display =
        "none";


    rematchArea.style.display =
        "none";


    let number = 3;


    countdown.textContent =
        number;


    const timer =
        setInterval(
            () => {

                number--;


                if (
                    number > 0
                ) {

                    countdown.textContent =
                        number;

                    return;
                }


                clearInterval(
                    timer
                );


                countdown.textContent =
                    "VS";


                setTimeout(
                    () => {

                        countdown.style.display =
                            "none";


                        battleArea.style.display =
                            "flex";


                        setTimeout(
                            () => {

                                battleResult.textContent =
                                    result;


                                battleResult.style.display =
                                    "block";


                                if (
                                    result === "WIN"
                                ) {

                                    battleResult.style.color =
                                        "#ffd95a";

                                } else if (
                                    result === "LOSE"
                                ) {

                                    battleResult.style.color =
                                        "#ff667d";

                                } else {

                                    battleResult.style.color =
                                        "#d4d4d4";
                                }


                                rematchArea.style.display =
                                    "block";


                                rematchButton.disabled =
                                    false;


                                rematchStatus.textContent =
                                    "";

                            },
                            1200
                        );

                    },
                    700
                );

            },
            700
        );
}


/* ========================================
   再戦
======================================== */

rematchButton
    .addEventListener(
        "click",
        () => {

            rematchButton.disabled =
                true;


            rematchStatus.textContent =
                "相手を待っています...";


            socket.emit(
                "rematchReady"
            );
        }
    );


socket.on(
    "rematchStatus",
    data => {

        if (
            data.hostReady &&
            data.guestReady
        ) {

            rematchStatus.textContent =
                "両者準備完了！";

        } else {

            rematchStatus.textContent =
                "相手の準備を待っています...";
        }
    }
);


/* ========================================
   ゲスト退出
======================================== */

socket.on(
    "guestLeft",
    () => {

        if (
            myRole !== "host"
        ) {
            return;
        }


        stopCharmMode();


        disableChoices();


        guestChoiceText.textContent =
            "まだ選んでいません";


        statusText.textContent =
            "ゲストが退出しました。新しい参加者を待っています...";
    }
);


/* ========================================
   部屋終了
======================================== */

socket.on(
    "roomClosed",
    message => {

        alert(
            message
        );


        window.location.href =
            window.location.origin;
    }
);


</script>


</body>

</html>
