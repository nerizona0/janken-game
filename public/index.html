<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>三界じゃんけん</title>


<style>

* {
    box-sizing: border-box;
}


/* ========================================
   背景
======================================== */

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    color: white;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow-x: hidden;

    background:
        linear-gradient(
            rgba(5, 2, 10, 0.58),
            rgba(10, 3, 15, 0.72)
        ),
        url("/images/background.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    background-attachment: fixed;
}


body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(80, 25, 100, 0.04),
            rgba(10, 3, 15, 0.25) 55%,
            rgba(0, 0, 0, 0.58)
        );
}


/* ========================================
   魅了背景
======================================== */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1;

    opacity: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 70, 180, 0.22),
            rgba(120, 20, 90, 0.16),
            rgba(20, 3, 20, 0.12)
        );

    transition:
        opacity 0.6s ease;
}


body.charmed::after {
    opacity: 1;
}


body.charmed {

    box-shadow:
        inset 0 0 120px
        rgba(255, 60, 170, 0.32);
}


/* ========================================
   基本
======================================== */

.container {

    width: min(1100px, 95%);

    text-align: center;

    position: relative;

    z-index: 2;
}


h1 {

    margin-bottom: 8px;

    font-size:
        clamp(30px, 6vw, 55px);

    letter-spacing: 0.08em;

    text-shadow:
        0 0 10px rgba(180, 120, 255, 0.7),
        0 0 30px rgba(120, 70, 255, 0.35);
}


.subtitle {

    opacity: 0.7;

    margin-bottom: 25px;
}


.screen {
    display: none;
}


.screen.active {
    display: block;
}


/* ========================================
   ボタン
======================================== */

button {

    border: none;

    border-radius: 14px;

    padding: 14px 25px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    color: white;

    background:
        linear-gradient(
            135deg,
            #7d52c7,
            #523083
        );

    box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.35);

    transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease;
}


button:hover:not(:disabled) {

    transform:
        translateY(-3px);

    box-shadow:
        0 8px 25px
        rgba(130, 80, 220, 0.5);
}


button:disabled {

    opacity: 0.35;

    cursor: not-allowed;
}


/* ========================================
   入力
======================================== */

input {

    width: min(350px, 90%);

    padding: 13px 15px;

    border:
        1px solid
        rgba(255, 255, 255, 0.2);

    border-radius: 10px;

    background:
        rgba(0, 0, 0, 0.35);

    color: white;

    font-size: 16px;

    outline: none;
}


.menu-buttons {

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;
}


.form-area {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 14px;
}


.error {

    color: #ff8a9e;

    min-height: 24px;
}


/* ========================================
   部屋情報
======================================== */

.room-info {

    margin: 18px auto;

    padding: 15px;

    max-width: 550px;

    border-radius: 14px;

    background:
        rgba(5, 2, 10, 0.62);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);

    backdrop-filter:
        blur(8px);
}


.room-code {

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 0.15em;

    color: #d7b8ff;
}


.share-url {

    margin-top: 10px;

    word-break: break-all;

    opacity: 0.75;

    font-size: 14px;
}


/* ========================================
   ★通算金額
======================================== */

.money-panel {

    margin:
        15px auto 20px;

    width:
        min(420px, 95%);

    padding:
        15px 20px;

    border-radius: 18px;

    background:
        rgba(5, 2, 10, 0.72);

    border:
        1px solid
        rgba(255, 220, 120, 0.3);

    box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.35);
}


.money-title {

    font-size: 14px;

    opacity: 0.7;
}


#moneyAmount {

    margin-top: 3px;

    font-size:
        clamp(28px, 6vw, 42px);

    font-weight: 900;

    color: #ffd76a;

    text-shadow:
        0 0 15px
        rgba(255, 200, 70, 0.35);
}


/* ========================================
   ステータス
======================================== */

#status {

    margin:
        10px 0 20px;

    min-height: 30px;

    font-size: 20px;

    font-weight: bold;

    text-shadow:
        0 2px 10px black;
}


/* ========================================
   カード
======================================== */

.choices {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: 25px;

    flex-wrap: wrap;

    margin-top: 20px;
}


.choice {

    width: 230px;

    padding: 18px 14px;

    border-radius: 22px;

    background:
        rgba(10, 5, 15, 0.62);

    border:
        1px solid
        rgba(255, 255, 255, 0.13);

    backdrop-filter:
        blur(7px);

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        opacity 0.25s ease,
        box-shadow 0.25s ease;
}


.choice:hover:not(.disabled) {

    transform:
        translateY(-6px)
        scale(1.03);

    background:
        rgba(50, 20, 65, 0.72);

    box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.5);
}


.choice.disabled {

    opacity: 0.3;

    cursor: not-allowed;

    filter:
        grayscale(0.8);
}


.choice.charm-locked {

    opacity: 0.16;

    filter:
        grayscale(1)
        brightness(0.55);
}


/* ========================================
   ふわふわ
======================================== */

@keyframes fluffySway {

    0%,
    100% {

        transform:
            translateX(-5px)
            rotate(-1.5deg);
    }

    50% {

        transform:
            translateX(5px)
            rotate(1.5deg);
    }
}


.choice img {

    width: 100%;

    height: 230px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0, 0, 0, 0.55)
        );

    animation:
        fluffySway
        2s
        ease-in-out
        infinite;

    transform-origin:
        center bottom;
}


.choice:nth-child(2) img {
    animation-delay: -0.65s;
}


.choice:nth-child(3) img {
    animation-delay: -1.3s;
}


.choice-name {

    margin-top: 8px;

    font-size: 24px;

    font-weight: bold;
}


.choice-hand {

    margin-top: 4px;

    opacity: 0.65;

    font-size: 14px;
}


/* ========================================
   ホスト操作
======================================== */

#hostPanel {

    display: none;

    margin:
        25px auto 0;

    padding: 20px;

    max-width: 760px;

    border-radius: 18px;

    background:
        rgba(5, 2, 10, 0.72);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);

    backdrop-filter:
        blur(9px);
}


.host-panel-title {

    font-size: 20px;

    font-weight: bold;

    color: #d9c4ff;

    margin-bottom: 15px;
}


#guestChoiceText {

    margin-bottom: 12px;

    font-size: 20px;

    font-weight: bold;

    color: #e1c9ff;
}


#charmButton {

    background:
        linear-gradient(
            135deg,
            #ff4fa7,
            #a82979
        );
}


#allowChoiceButton {

    margin-left: 8px;

    background:
        linear-gradient(
            135deg,
            #46b981,
            #237050
        );

    box-shadow:
        0 5px 20px
        rgba(70, 210, 140, 0.25);
}


#charmInfo {

    margin-top: 12px;

    min-height: 22px;

    color: #ff9bd2;
}


/* ========================================
   A/B変更
======================================== */

.guest-image-control {

    margin-top: 22px;

    padding-top: 18px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.12);
}


.guest-image-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 12px;

    color: #d8c2ff;
}


.image-change-buttons {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;
}


.image-change-button {

    padding: 10px 14px;

    font-size: 14px;

    background:
        linear-gradient(
            135deg,
            #4d416d,
            #33294c
        );
}


.image-change-button.active-b {

    background:
        linear-gradient(
            135deg,
            #bc55df,
            #7135a3
        );

    box-shadow:
        0 0 18px
        rgba(192, 90, 255, 0.4);
}


#guestImageInfo {

    margin-top: 12px;

    min-height: 20px;

    font-size: 14px;

    opacity: 0.8;
}


/* ========================================
   魅了
======================================== */

#charmFlash {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    pointer-events: none;

    opacity: 0;

    z-index: 999;

    font-size:
        clamp(
            50px,
            12vw,
            130px
        );

    text-shadow:
        0 0 20px #ff65bd,
        0 0 60px #ff218f;
}


#charmFlash.show {

    animation:
        charmFlashAnimation
        1.4s
        ease
        forwards;
}


@keyframes charmFlashAnimation {

    0% {
        opacity: 0;
        transform: scale(0.3);
    }

    30% {
        opacity: 1;
        transform: scale(1.25);
    }

    65% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(1.5);
    }
}


.charm-heart {

    position: fixed;

    pointer-events: none;

    z-index: 998;

    user-select: none;

    animation:
        heartFly
        2.2s
        ease-out
        forwards;
}


@keyframes heartFly {

    0% {

        opacity: 0;

        transform:
            translateY(30px)
            scale(0.4);
    }

    20% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-180px)
            scale(1.4)
            rotate(20deg);
    }
}


/* ========================================
   VS
======================================== */

#battleOverlay {

    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    background:
        rgba(5, 3, 10, 0.92);

    z-index: 500;

    backdrop-filter:
        blur(8px);
}


#battleOverlay.show {
    display: flex;
}


#countdown {

    font-size:
        clamp(
            80px,
            20vw,
            180px
        );

    font-weight: bold;
}


#battleArea {

    display: none;

    width:
        min(1000px, 95%);

    justify-content: center;

    align-items: center;

    gap: 30px;
}


.fighter {

    flex: 1;

    text-align: center;
}


.fighter img {

    width:
        min(330px, 35vw);

    height:
        min(400px, 45vh);

    object-fit: contain;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0, 0, 0, 0.6)
        );

    animation:
        fluffySway
        1.8s
        ease-in-out
        infinite;
}


.vs-text {

    font-size:
        clamp(
            45px,
            9vw,
            90px
        );

    font-weight: bold;

    color: #d4b0ff;
}


#battleResult {

    display: none;

    margin-top: 25px;

    font-size:
        clamp(
            50px,
            12vw,
            110px
        );

    font-weight: 900;

    letter-spacing: 0.08em;
}


/* ========================================
   ★金額変動演出
======================================== */

#moneyResult {

    display: none;

    margin-top: 8px;

    font-size:
        clamp(
            25px,
            6vw,
            45px
        );

    font-weight: 900;
}


.money-plus {

    color: #74f0a7;
}


.money-minus {

    color: #ff7089;
}


.money-zero {

    color: #dddddd;
}


#battleMoneyTotal {

    display: none;

    margin-top: 8px;

    font-size: 20px;

    color: #ffd76a;
}


#rematchArea {

    display: none;

    margin-top: 20px;
}


#rematchStatus {

    margin-top: 12px;

    opacity: 0.75;
}


/* ========================================
   スマホ
======================================== */

@media (max-width: 700px) {

    .choice {

        width: 29%;

        min-width: 100px;

        padding: 10px 6px;
    }


    .choice img {
        height: 150px;
    }


    .choices {
        gap: 8px;
    }


    .choice-name {
        font-size: 18px;
    }


    #allowChoiceButton {

        margin-left: 0;

        margin-top: 8px;
    }


    .image-change-buttons {
        flex-direction: column;
    }


    #battleArea {
        gap: 10px;
    }


    .fighter img {

        width: 34vw;

        height: 250px;
    }
}

</style>

</head>


<body>


<div id="charmFlash">
    💗 魅了 💗
</div>


<div class="container">


<h1>
    三界じゃんけん
</h1>


<div class="subtitle">
    魔族・人間・天使
</div>


<!-- =====================================
     メニュー
===================================== -->

<section
    id="menuScreen"
    class="screen active"
>

    <h2>
        遊び方を選択
    </h2>


    <div class="menu-buttons">

        <button id="showCreateButton">
            部屋を作る
        </button>

        <button id="showJoinButton">
            部屋に参加
        </button>

    </div>

</section>


<!-- =====================================
     部屋作成
===================================== -->

<section
    id="createScreen"
    class="screen"
>

    <h2>
        部屋を作る
    </h2>


    <div class="form-area">

        <input
            id="hostPassword"
            type="password"
            placeholder="ホスト用パスワード"
        >

        <button id="createRoomButton">
            作成
        </button>

        <div
            id="createError"
            class="error"
        ></div>

        <button id="backFromCreate">
            戻る
        </button>

    </div>

</section>


<!-- =====================================
     参加
===================================== -->

<section
    id="joinScreen"
    class="screen"
>

    <h2>
        部屋に参加
    </h2>


    <div class="form-area">

        <input
            id="roomIdInput"
            type="text"
            placeholder="部屋コード"
            maxlength="6"
        >

        <button id="joinRoomButton">
            参加
        </button>

        <div
            id="joinError"
            class="error"
        ></div>

        <button id="backFromJoin">
            戻る
        </button>

    </div>

</section>


<!-- =====================================
     ゲーム
===================================== -->

<section
    id="gameScreen"
    class="screen"
>


    <div class="room-info">

        部屋コード

        <div
            id="roomCode"
            class="room-code"
        ></div>

        <div
            id="shareUrl"
            class="share-url"
        ></div>

    </div>


    <!-- ★通算金額 -->

    <div class="money-panel">

        <div
            id="moneyTitle"
            class="money-title"
        >
            通算金額
        </div>

        <div id="moneyAmount">
            0円
        </div>

    </div>


    <div id="status">
        接続待ち...
    </div>


    <!-- =================================
         ホスト専用
    ================================== -->

    <div id="hostPanel">


        <div class="host-panel-title">
            ホスト操作
        </div>


        <div id="guestChoiceText">
            まだ選んでいません
        </div>


        <button id="charmButton">
            💗 魅了する
        </button>


        <button id="allowChoiceButton">
            🔓 ゲストの選択を許可
        </button>


        <div id="charmInfo"></div>


        <div class="guest-image-control">


            <div class="guest-image-title">
                ゲスト側のカード画像変更
            </div>


            <div class="image-change-buttons">


                <button
                    class="image-change-button"
                    data-image-choice="demon"
                >
                    😈 魔族：A
                </button>


                <button
                    class="image-change-button"
                    data-image-choice="human"
                >
                    👤 人間：A
                </button>


                <button
                    class="image-change-button"
                    data-image-choice="angel"
                >
                    👼 天使：A
                </button>


            </div>


            <div id="guestImageInfo">
                選択を許可する前に変更できます
            </div>


        </div>


    </div>


    <!-- =================================
         カード
    ================================== -->

    <div class="choices">


        <div
            class="choice"
            data-choice="demon"
        >

            <img
                id="demonImage"
                src="/images/demon.png"
                alt="魔族"
            >

            <div class="choice-name">
                魔族
            </div>

            <div class="choice-hand">
                グー
            </div>

        </div>


        <div
            class="choice"
            data-choice="human"
        >

            <img
                id="humanImage"
                src="/images/human.png"
                alt="人間"
            >

            <div class="choice-name">
                人間
            </div>

            <div class="choice-hand">
                チョキ
            </div>

        </div>


        <div
            class="choice"
            data-choice="angel"
        >

            <img
                id="angelImage"
                src="/images/angel.png"
                alt="天使"
            >

            <div class="choice-name">
                天使
            </div>

            <div class="choice-hand">
                パー
            </div>

        </div>


    </div>


</section>


</div>


<!-- =====================================
     バトル画面
===================================== -->

<div id="battleOverlay">


<div id="countdown">
    3
</div>


<div id="battleArea">


    <div class="fighter">

        <div>
            YOU
        </div>

        <img
            id="yourBattleImage"
            src=""
            alt=""
        >

    </div>


    <div class="vs-text">
        VS
    </div>


    <div class="fighter">

        <div>
            OPPONENT
        </div>

        <img
            id="opponentBattleImage"
            src=""
            alt=""
        >

    </div>


</div>


<div id="battleResult"></div>


<div id="moneyResult"></div>


<div id="battleMoneyTotal"></div>


<div id="rematchArea">

    <button id="rematchButton">
        もう一度
    </button>

    <div id="rematchStatus"></div>

</div>


</div>


<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();


/* ========================================
   DOM
======================================== */

const screens =
    document.querySelectorAll(".screen");


const menuScreen =
    document.getElementById("menuScreen");


const createScreen =
    document.getElementById("createScreen");


const joinScreen =
    document.getElementById("joinScreen");


const gameScreen =
    document.getElementById("gameScreen");


const statusText =
    document.getElementById("status");


const roomCode =
    document.getElementById("roomCode");


const shareUrl =
    document.getElementById("shareUrl");


const createError =
    document.getElementById("createError");


const joinError =
    document.getElementById("joinError");


const hostPanel =
    document.getElementById("hostPanel");


const guestChoiceText =
    document.getElementById("guestChoiceText");


const charmButton =
    document.getElementById("charmButton");


const allowChoiceButton =
    document.getElementById("allowChoiceButton");


const charmInfo =
    document.getElementById("charmInfo");


const guestImageInfo =
    document.getElementById("guestImageInfo");


const imageChangeButtons =
    document.querySelectorAll(
        ".image-change-button"
    );


const choices =
    document.querySelectorAll(".choice");


const demonImage =
    document.getElementById("demonImage");


const humanImage =
    document.getElementById("humanImage");


const angelImage =
    document.getElementById("angelImage");


const moneyTitle =
    document.getElementById("moneyTitle");


const moneyAmount =
    document.getElementById("moneyAmount");


const battleOverlay =
    document.getElementById("battleOverlay");


const countdown =
    document.getElementById("countdown");


const battleArea =
    document.getElementById("battleArea");


const battleResult =
    document.getElementById("battleResult");


const moneyResult =
    document.getElementById("moneyResult");


const battleMoneyTotal =
    document.getElementById(
        "battleMoneyTotal"
    );


const yourBattleImage =
    document.getElementById(
        "yourBattleImage"
    );


const opponentBattleImage =
    document.getElementById(
        "opponentBattleImage"
    );


const rematchArea =
    document.getElementById(
        "rematchArea"
    );


const rematchButton =
    document.getElementById(
        "rematchButton"
    );


const rematchStatus =
    document.getElementById(
        "rematchStatus"
    );


const charmFlash =
    document.getElementById(
        "charmFlash"
    );


/* ========================================
   状態
======================================== */

let myRole =
    null;


let currentRoomId =
    null;


let isCharmed =
    false;


let guestCanChoose =
    false;


let guestMoney =
    0;


let ambientHeartTimer =
    null;


let guestImages = {

    demon: false,

    human: false,

    angel: false
};


/* ========================================
   画面
======================================== */

function showScreen(screen) {

    screens.forEach(
        s => {

            s.classList.remove(
                "active"
            );
        }
    );


    screen.classList.add(
        "active"
    );
}


/* ========================================
   金額表示
======================================== */

function formatMoney(amount) {

    const sign =
        amount > 0
            ? "+"
            : "";


    return (
        sign +
        amount.toLocaleString("ja-JP") +
        "円"
    );
}


function updateMoneyDisplay() {


    if (
        myRole === "host"
    ) {

function updateImageChangeButtons() {

function getBattleImage(
    choice,
    role,
    charmed
) {


    if (
        role === "host"
    ) {


        if (
            choice === "demon"
        ) {
            return "/images/demon.png";
        }


        if (
            choice === "human"
        ) {
            return "/images/host_human.png";
        }


        if (
            choice === "angel"
        ) {
            return "/images/angel.png";
        }
    }


    if (
        role === "guest"
    ) {


        if (charmed) {


            if (
                choice === "human"
            ) {
                return "/images/human_charmed.png";
            }


            if (
                choice === "angel"
            ) {
                return "/images/angel_charmed.png";
            }
        }


        return getGuestNormalImage(
            choice
        );
    }


    return "";
}

function getChoiceName(choice) {


    if (
        choice === "demon"
    ) {
        return "魔族";
    }


    if (
        choice === "human"
    ) {
        return "人間";
    }


    if (

    }


    return "";
}


/* ========================================
   自分視点の勝敗
======================================== */

function getResult(
    you,
    opponent
) {


    if (
        you === opponent
    ) {
        return "DRAW";
    }


    if (

        (
            you === "demon" &&
            opponent === "human"
        )

        ||

        (
            you === "human" &&
            opponent === "angel"
        )

        ||

        (
            you === "angel" &&
            opponent === "demon"
        )

    ) {
        return "WIN";
    }


    return "LOSE";
}

function createHeart() {

        document.createElement(
            "div"
        );


    heart.className =
        "charm-heart";


    const hearts = [
        "💗",
        "💖",
        "💕",
        "💞",
        "💓"
    ];


    heart.textContent =
        hearts[
            Math.floor(
                Math.random() *
                hearts.length
            )
        ];


    heart.style.left =
        Math.random() *
        100 +
        "vw";


    heart.style.top =
        55 +
        Math.random() *
        40 +
        "vh";


    heart.style.fontSize =
        20 +
        Math.random() *
        45 +
        "px";


    document.body.appendChild(
        heart
    );


    setTimeout(
        () => {

            heart.remove();

        },
        3200
    );
}

    charmFlash.classList.remove(
        "show"

    void charmFlash.offsetWidth;


    charmFlash.classList.add(
        "show"

    for (
        let i = 0;

/* ========================================
   バトル演出
======================================== */

function showBattle(
    result,
    change,
    total
) {


    battleOverlay
        .classList
        .add(
            "show"
        );


    countdown.style.display =
        "block";


    battleArea.style.display =
        "none";


    battleResult.style.display =
        "none";


    moneyResult.style.display =
        "none";


    battleMoneyTotal.style.display =
        "none";


    rematchArea.style.display =
        "none";


    let number =
        3;


    countdown.textContent =
        number;


    const timer =
        setInterval(
            () => {


                number--;


                if (
                    number > 0
                ) {


                    countdown.textContent =
                        number;


                    return;
                }


                clearInterval(
                    timer
                );


                countdown.textContent =
                    "VS";


                setTimeout(
                    () => {


                        countdown.style.display =
                            "none";


                        battleArea.style.display =
                            "flex";


                        setTimeout(
                            () => {


                                battleResult.textContent =
                                    result;


                                battleResult.style.display =
                                    "block";


                                if (
                                    result === "WIN"
                                ) {


                                    battleResult.style.color =
                                        "#ffd95a";


                                } else if (
                                    result === "LOSE"
                                ) {


                                    battleResult.style.color =
                                        "#ff667d";


                                } else {


                                    battleResult.style.color =
                                        "#d4d4d4";
                                }


                                /*
                                    ★ゲスト基準の金額
                                */

                                moneyResult.className =
                                    "";


                                if (
                                    change > 0
                                ) {


                                    moneyResult.textContent =
                                        `ゲスト +${change.toLocaleString("ja-JP")}円`;


                                    moneyResult.classList.add(
                                        "money-plus"
                                    );


                                } else if (
                                    change < 0
                                ) {


                                    moneyResult.textContent =
                                        `ゲスト ${change.toLocaleString("ja-JP")}円`;


                                    moneyResult.classList.add(
                                        "money-minus"
                                    );


                                } else {


                                    moneyResult.textContent =
                                        "ゲスト ±0円";


                                    moneyResult.classList.add(
                                        "money-zero"
                                    );
                                }


                                moneyResult.style.display =
                                    "block";


                                battleMoneyTotal.textContent =
                                    `ゲスト通算：${formatMoney(total)}`;


                                battleMoneyTotal.style.display =
                                    "block";


                                rematchArea.style.display =
                                    "block";


                                rematchButton.disabled =
                                    false;


                                rematchStatus.textContent =
                                    "";

                            },
                            1200
                        );

                    },
                    700
                );

            },
            700
        );
}

        }


        guestMoney =
            0;


        guestCanChoose =
            false;


        updateMoneyDisplay();


        stopCharmMode();


        disableChoices();


        setHostPreparationButtons(
            false
        );


        guestChoiceText.textContent =
            "まだ選んでいません";


        statusText.textContent =
            "ゲストが退出しました。新しい参加者を待っています...";
    }
);


/* ========================================
   部屋終了
======================================== */

socket.on(
    "roomClosed",
    message => {


        alert(
            message
        );


        window.location.href =
            window.location.origin;
    }
);


</script>
